# Rate limit compartilhado pelos apps Next.js do servidor.
#
# A chave e o IP REAL do visitante: cloudflare.inc aplica real_ip_header
# CF-Connecting-IP no contexto http, entao $binary_remote_addr aqui e o IP
# do usuario, nao o da Cloudflare.
#
# HISTORICO
#   28/07/2026  criado com rate=5r/s burst=15 no location / de 20 vhosts
#   04/08/2026  rate 5r/s -> 20r/s: uma pagina Next.js dispara 25-30 requests
#               em paralelo, entao navegacao normal estourava o limite
#               (27.459 respostas 429, 1.139 IPs, 1.132 deles navegador real)
#   04/08/2026  isencao de crawler legitimo + de arquivo estatico (este arquivo)
#
# COMO FUNCIONA A ISENCAO
#   Chave vazia desativa o limite para a request. Duas situacoes ficam de fora:
#   1) Crawler legitimo de busca. Estrangular Googlebot atrasa indexacao, e
#      barrar Mediapartners-Google/AdsBot quebra a veiculacao do AdSense
#      (24 respostas 429 para Mediapartners-Google em setorenergetico
#      motivaram esta regra). Regra da casa: nunca bloquear o Google.
#   2) Arquivo estatico (/_next/static/, imagens, fontes, css/js). Sao o
#      grosso das 25-30 requests de um carregamento e nao pressionam o SSR,
#      entao nao devem consumir a cota do visitante.

# 1) Crawler legitimo -> 0 (isento)
map $http_user_agent $rl_ua {
    default                        1;
    "~*Googlebot"                  0;
    "~*Mediapartners-Google"       0;
    "~*AdsBot-Google"              0;
    "~*Google-InspectionTool"      0;
    "~*Google-Safety"              0;
    "~*Storebot-Google"            0;
    "~*APIs-Google"                0;
    "~*FeedFetcher-Google"         0;
    "~*bingbot"                    0;
    "~*BingPreview"                0;
    "~*Applebot"                   0;
    "~*DuckDuckBot"                0;
    "~*YandexBot"                  0;
    "~*facebookexternalhit"        0;
    "~*Twitterbot"                 0;
    "~*LinkedInBot"                0;
    "~*WhatsApp"                   0;
}

# 2) Arquivo estatico -> 0 (isento)
map $request_uri $rl_uri {
    default                                            1;
    "~^/_next/static/"                                 0;
    "~^/_next/image"                                   0;
    "~^/(images|img|imagens|assets|static|fonts|media)/" 0;
    "~*\.(css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|map)(\?|$)" 0;
    "~^/(favicon\.ico|robots\.txt|sitemap[^/]*\.xml|ads\.txt|manifest\.json)"       0;
}

# Limita so quando as duas condicoes dizem "limitar" (11).
map "$rl_ua$rl_uri" $rl_key {
    default    "";
    "11"       $binary_remote_addr;
}

limit_req_zone $rl_key <<REMOVIDO>> rate=20r/s;
limit_req_status 429;

# O default do limit_req e nivel `warn`; forcar `error` garante que a linha
# apareca no error.log para o Fail2ban (jail nginx-limit-req) enxergar.
limit_req_log_level error;
