<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexao - Seguidores Brasil</title>
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(135deg,#1a5cff,#6a3cff);color:#fff;
    display:grid;place-items:center;text-align:center;padding:24px}
  .box{max-width:420px}
  .ico{width:88px;height:88px;border-radius:24px;background:rgba(255,255,255,.15);
    display:grid;place-items:center;margin:0 auto 22px;font-size:44px}
  h1{font-size:1.6rem;margin:0 0 10px;font-weight:800}
  p{opacity:.9;line-height:1.6;margin:0 0 26px}
  button{font-weight:700;font-size:1rem;color:#1a5cff;background:#fff;border:0;
    padding:14px 28px;border-radius:14px;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="ico">📶</div>
    <h1>Voce esta sem internet</h1>
    <p>Nao foi possivel carregar o conteudo agora. Verifique sua conexao e tente novamente.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
