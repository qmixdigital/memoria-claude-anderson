# /etc/nginx/conf.d/qmix-invest.conf
# Vhost para QMIX Invest. Aplicação roda em containers Docker locais
# nas portas 3010 (app) e 3011 (app-b) com failover via upstream.
#
# IMPORTANTE: este site é PESSOAL e PRIVADO. Camadas de obscurecimento:
# 1. Subdomínio opaco (qf) — ninguém adivinha
# 2. HTTP Basic Auth — credenciais em /etc/nginx/.htpasswd-qmix-invest
# 3. X-Robots-Tag: noindex em todas as respostas
# 4. robots.txt servido com Disallow: /
# 5. (Opcional) Whitelist de IPs no allow/deny — descomentar se quiser
# 6. (Opcional) Cloudflare DNS-only (cinza, não laranja) — fora do scope deste arquivo

upstream qmix_invest_backend {
    server 127.0.0.1:3010 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3011 max_fails=2 fail_timeout=10s backup;
    keepalive 32;
}

# Redirect HTTP -> HTTPS (defesa em profundidade — Cloudflare proxy já força HTTPS)
#
# NOTA SOBRE O LISTEN: HestiaCP define um vhost com `listen <IP>:443 default_server ssl;`
# em /etc/nginx/conf.d/main/. Quando há um listen IP-específico no host, um listen
# genérico `listen 443` cria um socket separado e PERDE para o IP-específico.
# Solução: bind explícito ao mesmo IP (31.97.173.40) para competir corretamente
# pelo socket via SNI matching de server_name.
# Se mudar de VPS: substituir o IP abaixo OU remover o IP se a VPS não usa HestiaCP.
server {
    listen 31.97.173.40:80;
    server_name qf.qmix.digital;
    return 301 https://$host$request_uri;
}

server {
    listen 31.97.173.40:443 ssl;
    http2 on;
    server_name qf.qmix.digital;

    # Cloudflare Origin Certificate (15 anos, válido apenas atrás do proxy CF).
    # Gerado em: CF Dashboard → SSL/TLS → Origin Server → Create Certificate.
    # SSL/TLS mode no CF deve ser "Full (strict)" para validar este cert.
    ssl_certificate     /etc/ssl/qmix-invest/origin.pem;
    ssl_certificate_key /etc/ssl/qmix-invest/origin.key;

    # Cloudflare Authenticated Origin Pulls (opcional, defesa extra):
    # ssl_client_certificate /etc/ssl/qmix-invest/cf-authenticated-origin-pull-ca.pem;
    # ssl_verify_client on;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:qmix_invest_ssl:10m;  # nome único — outros vhosts da VPS já usam shared:SSL com tamanho diferente
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Anti-indexing — força search engines a NÃO indexar mesmo se descobrirem a URL
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # Logs separados (não polui logs dos outros sites)
    access_log /var/log/nginx/qmix-invest.access.log;
    error_log  /var/log/nginx/qmix-invest.error.log warn;

    # Limite de tamanho de body
    client_max_body_size 10m;

    # robots.txt servido aqui (não passa para o backend)
    location = /robots.txt {
        access_log off;
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # Opcional: whitelist de IPs (descomentar e adicionar seus IPs).
    # Exemplo: allow 200.123.45.67; deny all;
    # location / {
    #     allow 200.123.45.67;   # IP residencial
    #     allow 187.x.x.x;        # IP escritório
    #     deny all;
    #     ...
    # }

    # Bloqueio de bots conhecidos por User-Agent (defesa em profundidade)
    if ($http_user_agent ~* (Googlebot|Bingbot|YandexBot|DuckDuckBot|Baiduspider|SemrushBot|AhrefsBot|MJ12bot|DotBot|PetalBot)) {
        return 403;
    }

    # Webhook do Telegram (Fase 4) — endpoint sensível.
    # NÃO usa Basic Auth (Telegram não consegue passar credenciais).
    # Segurança vem do `secret_token` validado pelo Next.js + body signature.
    location /api/telegram/webhook {
        proxy_pass http://qmix_invest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Endpoint público de health (sem auth — usado por verify-other-sites do deploy)
    location = /api/health {
        proxy_pass http://qmix_invest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Tudo o mais: HTTP Basic Auth obrigatório.
    location / {
        # Caminho do arquivo de senhas (gerar com: htpasswd -c /etc/nginx/.htpasswd-qmix-invest <usuario>)
        auth_basic "QMIX Invest — Acesso Restrito";
        auth_basic_user_file /etc/nginx/.htpasswd-qmix-invest;

        proxy_pass http://qmix_invest_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Failover automático
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
