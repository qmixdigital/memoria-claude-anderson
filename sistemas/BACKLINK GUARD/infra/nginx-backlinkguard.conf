upstream backlinkguard_backend {
  server 127.0.0.1:3090 max_fails=2 fail_timeout=10s;
  server 127.0.0.1:3091 max_fails=2 fail_timeout=10s;
  keepalive 32;
}
server {
  listen 31.97.173.40:80;
  server_name backlinkguard.qmix.com.br;
  if ($cf_trusted = 0) { return 403; }
  client_max_body_size 25m;
  location / {
        # Rate limit contra bot bombardier (mitiga bug Next.js 16 SSR streaming)
        limit_req zone=nextjs_ip burst=15 nodelay;
    proxy_pass http://backlinkguard_backend; proxy_http_version 1.1;
    proxy_set_header Connection ""; proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2; proxy_read_timeout 120s;
  }
}
server {
  listen 31.97.173.40:443 ssl;
  http2 on;
  server_name backlinkguard.qmix.com.br;
  if ($cf_trusted = 0) { return 403; }
  ssl_certificate     /etc/ssl/portais/backlinkguard.qmix.com.br/origin-cf.pem;
  ssl_certificate_key /etc/ssl/portais/backlinkguard.qmix.com.br/origin-cf.key;
  ssl_protocols TLSv1.2 TLSv1.3; ssl_ciphers HIGH:!aNULL:!MD5;
  client_max_body_size 25m;
  location / {
        # Rate limit contra bot bombardier (mitiga bug Next.js 16 SSR streaming)
        limit_req zone=nextjs_ip burst=15 nodelay;
    proxy_pass http://backlinkguard_backend; proxy_http_version 1.1;
    proxy_set_header Connection ""; proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2; proxy_read_timeout 120s;
  }
}
