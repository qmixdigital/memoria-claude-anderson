<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#00ff66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>QMIX Indexation</title>
  <meta name="description" content="Acompanhamento de indexação de domínios no Google — QMIX Agency">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/imagens/icon-192.png">
  <link rel="apple-touch-icon" href="/imagens/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:<<REMOVIDO>>;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="login-screen" id="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="logo-text">QMIX <span>Indexation</span></div>
      </div>
      <p class="login-subtitle">Digite a senha para acessar</p>
      <div class="login-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" class="login-input" id="login-input" placeholder="Senha" autocomplete="off" inputmode="numeric">
      </div>
      <div class="login-error" id="login-error">Senha incorreta</div>
      <button class="login-btn" id="login-btn">Entrar</button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header" id="app-header" style="display:none;">
    <div class="header-left">
      <button class="btn-back" id="btn-back" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div>
          <div class="logo-text">QMIX <span>Indexation</span></div>
          <div class="header-subtitle" id="header-subtitle">Monitoramento de Indexação</div>
        </div>
      </div>
    </div>
    <button class="btn-refresh" id="btn-refresh" aria-label="Atualizar dados">
      <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </header>

  <!-- SEARCH -->
  <div class="search-bar" id="search-bar" style="display:none;">
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="search-input" placeholder="Buscar domínio..." autocomplete="off">
    </div>
  </div>

  <!-- MAIN -->
  <main class="main" id="app-main" style="display:none;">

    <!-- HOME VIEW -->
    <div class="view active" id="view-home">
      <div class="stats-bar">
        <div class="stat-card">
          <div class="stat-number" id="stat-domains">0</div>
          <div class="stat-label">Domínios</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-categories">0</div>
          <div class="stat-label">Categorias</div>
        </div>
      </div>

      <div class="section-title">Categorias</div>
      <div class="category-grid" id="category-grid"></div>
    </div>

    <!-- DOMAINS VIEW -->
    <div class="view" id="view-domains">
      <div class="domain-list" id="domain-list"></div>
    </div>

    <!-- DETAIL VIEW -->
    <div class="view" id="view-detail"></div>

    <!-- REPORTS VIEW -->
    <div class="view" id="view-reports"></div>

  </main>

  <!-- TOAST -->
  <div class="toast-container" id="toast-container"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" id="bottom-nav" style="display:none;">
    <button class="nav-btn active" data-tab="indexation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
      <span>Indexação</span>
    </button>
    <button class="nav-btn" data-tab="reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Relatórios</span>
    </button>
  </nav>

  <script src="/status.js?v=20260626d"></script>
  <script src="/gsc.js?v=20260626d"></script>
  <script src="/app.js?v=20260626d"></script>
</body>
</html>
